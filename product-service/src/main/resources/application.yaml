server:
    port: 8081

spring:
    application:
        name: PRODUCT-SERVICE
    datasource:
        url: jdbc:mysql://localhost:3306/vanga_shop?createDatabaseIfNotExist=true
        username: root
        password: 
        driver-class-name: com.mysql.cj.jdbc.Driver
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                dialect: org.hibernate.dialect.MySQLDialect
    sql:
        init:
            mode: always

eureka:
    client:
        serviceUrl:
            defaultZone: http://localhost:8761/eureka/
