server:
    port: 8081

spring:
    application:
        name: PRODUCT-SERVICE
    datasource:
        url: jdbc:mysql://localhost:3306/product_db?createDatabaseIfNotExist=true
        username: root
        password: 
        driver-class-name: com.mysql.cj.jdbc.Driver
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                dialect: org.hibernate.dialect.MySQLDialect

eureka:
    client:
        serviceUrl:
            defaultZone: http://localhost:8761/eureka/
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  # Forces Swagger to use the gateway URL (localhost:8080) instead of the internal service URL
  override-with-generic-response: true

